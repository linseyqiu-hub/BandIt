# ============================================================
# BandIt — compose.yaml
# ============================================================
#
# Start:   docker compose up
# Stop:    docker compose down       (keeps volumes)
# Nuke:    docker compose down -v    (deletes volumes too)
# Rebuild: docker compose up --build (rebuilds images)
# Logs:    docker compose logs -f api
# Ingest:  docker compose run --rm ingest
#
# Services on a private network:
#   api    — FastAPI app, the ONLY published port
#   chroma — vector search, official image, no published port
#   redis  — rate limiter (placeholder, nothing uses it yet)
#   ingest — one-off job (profile "tools"): fills Chroma from
#            ./data, then exits. Skipped by plain "compose up".
#
# Config comes from env/ (see env/config.env):
#   env_file:    → the same per-concern files the host uses
#   environment: → ONLY values that differ inside the network
#                  (service DNS names instead of localhost)
# HF_HOME is set in the Dockerfile, not here.
# ============================================================


services:

  # ── API ──────────────────────────────────────────────────
  api:
    build:
      context: .
      target: serving          # Dockerfile stage
    image: bandit-api
    ports:
      - "8000:8000"            # the one hole in the wall
    env_file:
      - env/config.env         # non-secret config (committed)
      - env/hf.env             # HF_TOKEN
      - env/llm.env            # ANTHROPIC_API_KEY
    environment:               # container-only overrides
      CHROMA_HOST: chroma      # DNS name on the compose network
      CHROMA_PORT: 8000        # chroma's port INSIDE the network
      REDIS_URL: redis://redis:6379/0
    volumes:
      - model-cache:/models    # HF downloads persist across restarts
    depends_on:
      chroma:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      start_period: 60s        # first start downloads ~700MB from HF
      retries: 3

  # ── Ingest (one-off job) ─────────────────────────────────
  ingest:
    build:
      context: .
      target: ingest           # serving + pandas
    image: bandit-ingest
    profiles: [tools]          # only runs via "docker compose run"
    env_file:
      - env/config.env         # no secrets: loads ChromaSettings only
    environment:
      CHROMA_HOST: chroma
      CHROMA_PORT: 8000
    volumes:
      - ./data:/app/data:ro    # CSV from the host, read-only
      - model-cache:/models    # MiniLM cached once, shared with api
    depends_on:
      chroma:
        condition: service_healthy

  # ── ChromaDB ─────────────────────────────────────────────
  chroma:
    image: chromadb/chroma:1.5.9
    volumes:
      - chroma-data:/data      # collections persist across restarts
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/8000"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3
    # No ports: — only reachable from the compose network

  # ── Redis (placeholder) ─────────────────────────────────
  redis:
    image: redis:7-alpine
    # No volumes — rate limit buckets refill naturally,
    # losing them on restart is harmless.
    # No ports: — only reachable from the compose network


volumes:
  model-cache:      # HF model downloads — survives container rebuilds
  chroma-data:      # vector index — survives container rebuilds